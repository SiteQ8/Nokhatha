# Generate the Xcode project with: brew install xcodegen && cd ios && xcodegen generate
name: Nokhatha
options:
  bundleIdPrefix: com.eworldq8
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  NokhathaKit:
    path: NokhathaKit
targets:
  Nokhatha:
    type: application
    platform: iOS
    sources:
      - path: Nokhatha
        excludes:
          - "Fonts/*.txt"
      - path: ../docs/data
        type: folder
        buildPhase: resources
    dependencies:
      - package: NokhathaKit
    info:
      path: Nokhatha/Info.plist
      properties:
        CFBundleDisplayName: نُوخذة
        CFBundleName: Nokhatha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: لتصوير فاتورة الجهاز وحفظها مع ضمانه على جهازك
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
          - ReemKufi-SemiBold.ttf
          - ReemKufi-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eworldq8.nokhatha
        DEVELOPMENT_TEAM: FKZPXUFH45
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          # Signing for the store, on the app target only: a Swift package cannot take a profile,
          # so the profile arrives through NOKHATHA_PROFILE instead of a global override.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(NOKHATHA_PROFILE)
