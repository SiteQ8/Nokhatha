# Builds نُوخذة for Android on every change to the app or the shared data:
# the engine against the shared vectors and the web parity fixture, release lint,
# a check that the app asks for no permission beyond reminders, a debug apk to
# install from Artifacts, and the Play screenshots taken on an emulator.
# Signing and uploading to Play happen in android-release.yml on an android-v tag.

name: android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'docs/data/**'
      - 'tests/vectors.json'
      - 'tests/fixtures/**'
      - 'tools/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Engine, shared vectors and web parity
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Release lint
        run: cd android && ./gradlew --no-daemon :app:lintRelease

      - name: Debug build
        run: cd android && ./gradlew --no-daemon :app:assembleDebug

      # The app asks for the internet (the opt-in weather) and reminders, and nothing else.
      - name: Permissions allowlist
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          $AAPT2 dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee perms.txt
          BAD=$(grep "uses-permission" perms.txt | grep -v -e INTERNET -e POST_NOTIFICATIONS -e RECEIVE_BOOT_COMPLETED -e DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION || true)
          if [ -n "$BAD" ]; then echo "unexpected permission: $BAD"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: nokhatha-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A 1080 by 1920 screen: Play refuses screenshots longer than twice their width.
      - name: Screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 5X
          disable-animations: true
          script: sh tools/android/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nokhatha-android-screenshots
          path: shots
          retention-days: 14
